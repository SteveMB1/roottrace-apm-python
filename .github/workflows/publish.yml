name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # skip-existing is deliberately NOT set. It was, to make a re-run tag a
      # no-op instead of an upload conflict, but it cannot tell a re-run from a
      # filename PyPI refuses to reissue: both come back as "already exists"
      # and both were reported as success. After the 0.4.3 files were deleted
      # from the index that distinction is the whole question, and a green run
      # that uploaded nothing is the worst answer to it. A genuine re-run of an
      # already-published tag now fails loudly, which is the rarer case and the
      # safer one to be wrong about.
      - uses: pypa/gh-action-pypi-publish@release/v1
